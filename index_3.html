<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>CPC 45-Day Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@500;700;800&family=Sora:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Sora',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;-webkit-tap-highlight-color:transparent}
button{font-family:'Sora',sans-serif;cursor:pointer;border:none;background:none;color:inherit}
button:active{transform:scale(.96)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#475569;border-radius:2px}
:root{--bg:#0f172a;--cd:rgba(30,41,59,.8);--tx:#e2e8f0;--sb:#94a3b8;--bd:rgba(51,65,85,.6);--ok:#10b981;--no:#dc2626;--r:16px;
--fH:'Playfair Display',serif;--fM:'JetBrains Mono',monospace;--fU:'Sora',sans-serif;--fC:'Caveat',cursive}

.app{display:flex;flex-direction:column;height:100dvh}
.G{background:var(--cd);backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);border:1px solid var(--bd)}

/* Header */
.hdr{padding:14px 16px;color:#fff;flex-shrink:0}
.hdr-in{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hdr h1{font-size:17px;font-weight:900;font-family:var(--fH)}
.hdr .sub{font-size:9px;opacity:.8;font-family:var(--fM)}
.hdr-st{display:flex;align-items:center;gap:8px}
.sp{text-align:center;min-width:36px}.sp .v{font-size:14px;font-weight:800;font-family:var(--fM)}.sp .l{font-size:7px;opacity:.8;text-transform:uppercase}
.ib{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px}
.pbar{max-width:800px;margin:6px auto 0;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.pfill{height:100%;border-radius:4px;background:linear-gradient(90deg,#fff,#34d399);transition:width .5s}

/* Nav */
.nav{border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50;flex-shrink:0}
.nav-in{max-width:800px;margin:0 auto;display:flex}
.nav button{flex:1;padding:10px;font-size:12px;font-weight:700;border-bottom:3px solid transparent}

/* Content */
.cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cnt-in{max-width:800px;margin:0 auto;padding:14px 14px 120px;position:relative}

/* Day watermark — giant day number behind content */
.watermark{position:fixed;bottom:-40px;right:-20px;font-size:320px;font-weight:900;font-family:var(--fH);color:rgba(255,255,255,.02);pointer-events:none;z-index:0;line-height:1;user-select:none}

/* Day nav */
.dnav{display:flex;align-items:center;gap:5px;margin-bottom:12px;position:relative;z-index:1}
.dnav>button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--bd);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.ddots{flex:1;display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.wdots{display:flex;gap:1.5px}
.dot{width:9px;height:9px;border-radius:2px;cursor:pointer;transition:.25s}
.dot:hover{transform:scale(1.3)}.dot.cur{width:14px;height:14px;border-radius:4px}
.dot.dn{background:var(--ok)!important;box-shadow:0 0 6px rgba(16,185,129,.3)}

/* Hero with background image */
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:12px;height:150px;background-size:cover;background-position:center;z-index:1}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.7))}
.hero-wm{position:absolute;top:50%;right:20px;transform:translateY(-50%);font-size:120px;font-weight:900;font-family:var(--fH);color:rgba(255,255,255,.08);line-height:1;z-index:0}
.hero-ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;color:#fff;z-index:1}
.hero-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;font-family:var(--fM);color:#fbbf24}
.hero-ti{font-size:22px;font-weight:900;line-height:1.1;margin-top:3px;font-family:var(--fH);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hero-sub{font-size:11px;opacity:.85;margin-top:3px;font-style:italic}
.hero-pct{position:absolute;top:12px;right:14px;font-size:28px;font-weight:900;font-family:var(--fM);text-shadow:0 2px 8px rgba(0,0,0,.5);z-index:1}
.hero-bar{position:absolute;bottom:0;left:0;height:5px;z-index:2;transition:width .5s}

/* Clock */
.clk{border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:10px;border:1.5px solid var(--bd);min-height:80px;z-index:1;position:relative}

/* Group */
.grp{border-radius:var(--r);margin-bottom:10px;overflow:hidden;border:1.5px solid var(--bd);transition:.2s;min-height:70px;position:relative;z-index:1}
.grp:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.15)}
.grp.gd{border-color:var(--ok)}
.gh{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;overflow:hidden}
.gh-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.08;z-index:0}
.gh>*{position:relative;z-index:1}
.g-ico{font-size:20px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.g-info{flex:1;min-width:0}
.g-tag{display:inline-block;padding:2px 10px;border-radius:8px;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.g-ti{font-size:14px;font-weight:700;margin-left:6px}
.g-ref{font-size:10px;color:var(--sb);margin-top:2px;font-style:italic}
.g-brow{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.bb{display:inline-flex;padding:1px 6px;border-radius:5px;font-size:7px;font-weight:800;font-family:var(--fM)}
.g-ts{font-size:9px;color:var(--ok);font-weight:700;margin-top:2px;font-family:var(--fM)}
.g-cnt{font-size:12px;font-weight:800;white-space:nowrap;font-family:var(--fM)}
.g-arr{font-size:10px;color:var(--sb);transition:transform .3s}.g-arr.op{transform:rotate(180deg)}
.g-body{padding:0 14px 14px;animation:sd .25s ease}
.g-note{font-size:14px;padding:8px 12px;border-radius:8px;margin-bottom:10px;line-height:1.4;font-family:var(--fC);border-left:3px solid #854F0B}

/* Step */
.stp{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer}
.stp+.stp{border-top:1px solid var(--bd)}
.cb{width:24px;height:24px;border-radius:8px;border:2.5px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:.3s}
.cb.ck{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px rgba(16,185,129,.3)}
.cb.ck::after{content:'✓';color:#fff;font-size:13px;font-weight:900}
.stx{font-size:13px;line-height:1.4}.stx.sd{opacity:.4;text-decoration:line-through}
.sts{font-size:8px;color:var(--ok);font-weight:700;margin-top:2px;font-family:var(--fM)}
.stm{font-size:9px;color:var(--sb);font-weight:700;padding:3px 10px;border-radius:8px;background:rgba(15,23,42,.5);font-family:var(--fM);white-space:nowrap}

/* All Days */
.wh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.wbd{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:800}
.dr{border-radius:12px;padding:10px 14px;margin-bottom:6px;border:1.5px solid var(--bd);display:flex;align-items:center;gap:10px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.dr:hover{transform:translateX(3px)}.dr.dd{border-color:var(--ok)}
.dr-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.06}
.dnum{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;font-family:var(--fM);position:relative;z-index:1}

/* Stats */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sc{border-radius:var(--r);padding:14px;border-left:4px solid}
.sl{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--sb)}
.sv{font-size:26px;font-weight:900;margin-top:3px;font-family:var(--fM)}
.wr{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.wl{width:45px;font-size:11px;font-weight:800}
.wt{flex:1;height:10px;border-radius:5px;background:var(--bd);overflow:hidden}
.wf{height:100%;border-radius:5px;transition:width .5s}
.wp{width:32px;text-align:right;font-size:11px;font-weight:800;color:var(--sb);font-family:var(--fM)}
.pnl{margin-top:14px;border-radius:var(--r);padding:14px;border:1.5px solid}
.dz{margin-top:14px;padding:14px;border-radius:var(--r);border:1.5px solid #fca5a5;background:rgba(127,29,29,.1)}
.si{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font-size:13px;outline:none;margin-bottom:12px}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;font-size:12px;font-weight:700;color:#fff;z-index:200;animation:su .3s ease;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sdot.on{background:#34d399;box-shadow:0 0 6px #34d399}
.sdot.off{background:#f59e0b}
.cf{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.cp{position:absolute;animation:cfa 2.5s ease-out forwards}

@keyframes sd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes su{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes cfa{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),100vh) rotate(720deg);opacity:0}}
@supports(padding:max(0px)){.hdr{padding-top:max(14px,env(safe-area-inset-top))}.cnt-in{padding-bottom:max(120px,calc(80px + env(safe-area-inset-bottom)))}}
</style>
</head>
